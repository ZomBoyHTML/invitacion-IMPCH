<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>invitacion IMPCH</title>
<link rel="icon" type="image/png" sizes="32x32" href="img/logo.png">
<link rel="icon" type="image/png" sizes="192x192" href="img/logo.png">

<style>
:root{--bg:#fbf6ee;--card:#fff;--ink:#2b2118;--muted:#7a6a5a;--accent:#b5532a;--line:#eadfce;--btn-ink:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1511;--card:#261e18;--ink:#f3e9dc;--muted:#b9a894;--accent:#e08a5c;--line:#3a2e25;--btn-ink:#1b1511;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1b1511;--card:#261e18;--ink:#f3e9dc;--muted:#b9a894;--accent:#e08a5c;--line:#3a2e25;--btn-ink:#1b1511;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif;line-height:1.5}
html,body{height:100%;overflow:hidden}
[hidden]{display:none!important}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.9) translateY(20px)}to{opacity:1;transform:none}}
@keyframes logoin{from{opacity:0;transform:scale(.3) rotate(-120deg)}to{opacity:1;transform:none}}
#inv .card{animation:pop .6s ease-out both}
#inv .card>*{animation:rise .55s ease-out both}
#inv .card>.logo{animation:logoin .9s cubic-bezier(.2,.8,.2,1) both}
@media (prefers-reduced-motion:reduce){#inv .card,#inv .card>*{animation:none!important}}
main{max-width:480px;margin:0 auto;height:100%;display:flex;align-items:center;justify-content:center;padding:12px 16px}
#inv{width:100%;max-height:100%;display:flex}
.card{scrollbar-width:none}
.card::-webkit-scrollbar{display:none}
#ask{text-align:center;width:100%;display:flex;flex-direction:column;align-items:center;gap:18px}
#ask .dove{font-size:56px;line-height:1}
#ask h2{font-weight:normal;font-size:clamp(28px,8vw,38px);line-height:1.15;margin:0}
#msg{min-height:48px;color:var(--accent);font-family:system-ui,sans-serif;font-size:20px;font-weight:600;line-height:1.3;margin:0;padding:0 8px}
#yes,#no{font-family:system-ui,sans-serif;font-weight:700;border:0;border-radius:14px;cursor:pointer;max-width:100%}
.btns{display:flex;flex-direction:row;align-items:center;justify-content:center;gap:12px;width:100%}
#yes{min-width:0;background:var(--accent);color:var(--btn-ink);font-size:20px;padding:14px 28px}
#no{flex-shrink:0;background:transparent;border:1px solid var(--muted);color:var(--muted);font-size:18px;padding:10px 22px}
#yes.full{position:fixed;inset:0;z-index:5;border-radius:0;font-size:16vw;padding:0;max-width:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px 18px;text-align:center;width:100%;max-height:100%;overflow-y:auto}
.eyebrow{letter-spacing:.25em;text-transform:uppercase;font-size:12px;color:var(--accent)}
h1{font-size:clamp(26px,5.2vh,38px);line-height:1.1;margin:10px 0 6px;font-weight:normal}
.sub{color:var(--muted);margin:0 0 10px;font-size:15px}
.rule{height:1px;background:var(--line);margin:12px 0}
.row{display:flex;justify-content:space-around;gap:10px;flex-wrap:wrap}
.item small{display:block;color:var(--muted);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.item b{font-weight:normal;font-size:19px}
.map{margin:8px 0 6px;max-height:12vh}
.addr{font-size:19px;margin:6px 0 2px}
.addr-sub{color:var(--muted);font-size:15px;margin:0}
.logo{width:min(13vh,84px);height:min(13vh,84px);border-radius:50%;display:block;margin:0 auto;background:#fff}
.btn{display:block;width:100%;padding:14px;margin-top:10px;border-radius:12px;text-decoration:none;font-family:system-ui,sans-serif;font-size:16px;font-weight:600;text-align:center}
.primary{background:var(--accent);color:var(--btn-ink)}
.ghost{border:1px solid var(--accent);color:var(--accent)}
.note{font-family:system-ui,sans-serif;font-size:13px;color:var(--muted);margin-top:16px}
</style>
</head>
